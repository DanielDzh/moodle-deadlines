name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Worker typecheck and tests
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
