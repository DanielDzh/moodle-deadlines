name: Deploy site

# Publishes the static site to Cloudflare after a change lands in main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/deployment.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm test
      - run: npm run build
      # Cloudflare's asset upload sometimes fails with a transient error (code 10013) that disappears on a retry.
      - name: Deploy (up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            if npx wrangler@4.153.0 deploy; then exit 0; fi
            echo "::warning::Deploy attempt $attempt failed at $(date -u +%H:%M:%S) UTC"
            # Public data only (this repository's logs are public): is Cloudflare reporting a named incident right now?
            # The overall status text is not used: it almost always says "Partial System Outage" because of single data centres.
            curl -fsS --max-time 10 https://www.cloudflarestatus.com/api/v2/incidents/unresolved.json \
              | python3 -c "import sys,json; d=json.load(sys.stdin)['incidents']; print('Cloudflare unresolved incidents:', len(d)); [print(' -', i['impact'], '|', i['name'], '|', i['status']) for i in d]" || true
            sleep 20
          done
          exit 1
